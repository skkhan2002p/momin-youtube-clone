<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MominTube</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header-left">
            <button class="icon-btn menu-btn" aria-label="Menu">
                <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            </button>
            <div class="logo-container">
                <span class="logo-icon">▶</span>
                <span class="logo-text">Momin Hessen</span>
            </div>
        </div>
        <div class="header-center">
            <div class="search-box">
                <input type="text" placeholder="Search" id="searchInput">
                <button class="search-btn" aria-label="Search">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                </button>
            </div>
        </div>
        <div class="header-right">
            <button class="icon-btn" aria-label="Create">
                <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4zM14 13h-3v3H9v-3H6v-2h3V8h2v3h3v2z"/></svg>
            </button>
            <button class="icon-btn" aria-label="Notifications">
                <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"/></svg>
            </button>
            <div class="user-avatar" title="Momin Hessen">MH</div>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <a href="#" class="sidebar-item active">
                <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span>Home</span>
            </a>
            <a href="#" class="sidebar-item">
                <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M10 14.65v-5.3L15 12l-5 2.65zm7.77-4.33c-.77-.32-1.2-.5-1.2-.5L18 9c1.1-3.9-2.3-6.5-6-6.5-4.14 0-7.5 3.36-7.5 7.5 0 2.2 1.01 4.15 2.58 5.48L6 18.5l4.5-1.5c.48.11.98.17 1.5.17 4.14 0 7.5-3.36 7.5-7.5 0-.96-.18-1.89-.51-2.74z"/></svg>
                <span>Shorts</span>
            </a>
            <a href="#" class="sidebar-item">
                <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M20 7H4v10h16V7zM2 5h20v14H2V5z"/></svg>
                <span>Subscriptions</span>
            </a>
            <hr class="sidebar-divider">
            <a href="#" class="sidebar-item">
                <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
                <span>You</span>
            </a>
        </aside>

        <main class="content">
            <div class="chips-bar">
                <button class="chip active">All</button>
                <button class="chip">Coding</button>
                <button class="chip">Web Development</button>
                <button class="chip">UI/UX Design</button>
                <button class="chip">JavaScript</button>
                <button class="chip">Mobile Apps</button>
                <button class="chip">Live Streams</button>
            </div>

            <div class="video-grid" id="videoGrid">
                <!-- Videos injected dynamically or rendered via HTML -->
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
